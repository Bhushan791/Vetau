# fly.toml app configuration file generated for vetaunp on 2025-12-10T17:32:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'vetaunp'
primary_region = 'bom'

[build]

[processes]
  app = "npm start"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
